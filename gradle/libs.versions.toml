[versions]
agp = "9.0.1"
kotlin = "2.3.10"

android-compileSdk = "36"
android-minSdk = "28"

# Encrypted DataStore stack (replaces the deprecated androidx.security:security-crypto path).
# - androidx-datastore: Preferences DataStore, KMP-published since 1.1 (Android Developers,
#   "Set up DataStore for KMP"). 1.2.1 is the latest stable that publishes iosArm64 +
#   iosSimulatorArm64 KMP variants on Google Maven. In `credential-manager/` it feeds the
#   Android side only — iOS reverts to direct Keychain via cinterop (see the divergence flag
#   `article/orchestration/divergence-flags/01-ios-architecture-revision.md`). The sibling
#   `credential-manager-unified/` module still uses it on iOS through `OkioStorage`.
# - okio: explicit alias kept for the unified iOS DataStore path, where `OkioStorage` still backs
#   the `credential-manager-unified/` implementation. The canonical Android module uses DataStore
#   `FileStorage` and no longer declares the Okio alias directly.
# - tink: Android-side encryption. Tink Java is JVM/Android only — that's why this version
#   only feeds androidMain in either module.
# - androidx-security-crypto stays at the original alpha to seed the legacy migration source —
#   the new code path no longer depends on it for fresh writes. The library is officially
#   deprecated as of 1.1.0 stable (developer.android.com / security release notes).
androidx-datastore = "1.2.1"
androidx-security-crypto = "1.1.0-alpha06"
koin = "4.1.1"
kotlinx-coroutines = "1.10.2"
okio = "3.10.2"
tink-android = "1.21.0"

[libraries]
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "androidx-datastore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink-android" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
